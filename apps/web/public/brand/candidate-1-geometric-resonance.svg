<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#111B33" />
      <stop offset="70%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#05070B" />
    </radialGradient>
    <linearGradient id="wave-cyan-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="tree-branch-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad-1)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#22D3EE" stroke-opacity="0.15" stroke-width="2" />

  <!-- Harmonic Soundwave Rings (Concentric Resonance) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366F1" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#22D3EE" stroke-opacity="0.2" stroke-width="1.5" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="2" />

  <!-- Overlapping Soundwave Harmonics (Sinusoidal Nodes) -->
  <path d="M 96 256 C 140 170, 180 170, 256 256 C 332 342, 372 342, 416 256" fill="none" stroke="url(#wave-cyan-violet)" stroke-width="4" stroke-linecap="round" filter="url(#glow-1)" />
  <path d="M 96 256 C 140 342, 180 342, 256 256 C 332 170, 372 170, 416 256" fill="none" stroke="url(#wave-cyan-violet)" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.7" />
  
  <!-- 256-depth SMT Binary Branching Lattice (Top & Bottom Trees) -->
  <!-- Upper Tree Branches -->
  <line x1="256" y1="256" x2="256" y2="156" stroke="url(#tree-branch-grad)" stroke-width="2" />
  <line x1="256" y1="156" x2="196" y2="106" stroke="url(#tree-branch-grad)" stroke-width="1.5" />
  <line x1="256" y1="156" x2="316" y2="106" stroke="url(#tree-branch-grad)" stroke-width="1.5" />
  <line x1="196" y1="106" x2="166" y2="76" stroke="url(#tree-branch-grad)" stroke-width="1.2" stroke-dasharray="2 3" />
  <line x1="196" y1="106" x2="226" y2="76" stroke="url(#tree-branch-grad)" stroke-width="1.2" stroke-dasharray="2 3" />
  <line x1="316" y1="106" x2="286" y2="76" stroke="url(#tree-branch-grad)" stroke-width="1.2" stroke-dasharray="2 3" />
  <line x1="316" y1="106" x2="346" y2="76" stroke="url(#tree-branch-grad)" stroke-width="1.2" stroke-dasharray="2 3" />

  <!-- Lower Tree Branches -->
  <line x1="256" y1="256" x2="256" y2="356" stroke="url(#tree-branch-grad)" stroke-width="2" />
  <line x1="256" y1="356" x2="196" y2="406" stroke="url(#tree-branch-grad)" stroke-width="1.5" />
  <line x1="256" y1="356" x2="316" y2="406" stroke="url(#tree-branch-grad)" stroke-width="1.5" />
  <line x1="196" y1="406" x2="166" y2="436" stroke="url(#tree-branch-grad)" stroke-width="1.2" stroke-dasharray="2 3" />
  <line x1="196" y1="406" x2="226" y2="436" stroke="url(#tree-branch-grad)" stroke-width="1.2" stroke-dasharray="2 3" />
  <line x1="316" y1="406" x2="286" y2="436" stroke="url(#tree-branch-grad)" stroke-width="1.2" stroke-dasharray="2 3" />
  <line x1="316" y1="406" x2="346" y2="436" stroke="url(#tree-branch-grad)" stroke-width="1.2" stroke-dasharray="2 3" />

  <!-- SMT Micro Nodes -->
  <circle cx="166" cy="76" r="4" fill="#22D3EE" />
  <circle cx="226" cy="76" r="4" fill="#A855F7" />
  <circle cx="286" cy="76" r="4" fill="#22D3EE" />
  <circle cx="346" cy="76" r="4" fill="#A855F7" />
  <circle cx="196" cy="106" r="6" fill="#6366F1" />
  <circle cx="316" cy="106" r="6" fill="#6366F1" />
  <circle cx="256" cy="156" r="8" fill="#22D3EE" />

  <circle cx="166" cy="436" r="4" fill="#22D3EE" />
  <circle cx="226" cy="436" r="4" fill="#A855F7" />
  <circle cx="286" cy="436" r="4" fill="#22D3EE" />
  <circle cx="346" cy="436" r="4" fill="#A855F7" />
  <circle cx="196" cy="406" r="6" fill="#6366F1" />
  <circle cx="316" cy="406" r="6" fill="#6366F1" />
  <circle cx="256" cy="356" r="8" fill="#22D3EE" />

  <!-- Central Poseidon SMT Harmonic Root Node -->
  <circle cx="256" cy="256" r="22" fill="#0E172B" stroke="#22D3EE" stroke-width="3" filter="url(#glow-1)" />
  <circle cx="256" cy="256" r="10" fill="#E0E7FF" />
</svg>