<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-grad-3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#081A1B" />
      <stop offset="70%" stop-color="#050C12" />
      <stop offset="100%" stop-color="#020508" />
    </radialGradient>
    <linearGradient id="monogram-c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="smt-depth-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6EE7B7" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow-3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad-3)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#10B981" stroke-opacity="0.15" stroke-width="2" />

  <!-- Harmonic Resonance Waves inside C cavity -->
  <path d="M 230 206 C 260 206, 290 220, 310 256 C 290 292, 260 306, 230 306" fill="none" stroke="#10B981" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 6" />
  <path d="M 200 176 C 250 176, 310 200, 340 256 C 310 312, 250 336, 200 336" fill="none" stroke="#34D399" stroke-opacity="0.35" stroke-width="2" />
  <path d="M 170 146 C 240 146, 330 180, 370 256 C 330 332, 240 366, 170 366" fill="none" stroke="#059669" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 8" />

  <!-- 256-depth SMT Binary Tree Projection Radiating from C Spine -->
  <line x1="160" y1="256" x2="100" y2="256" stroke="url(#smt-depth-grad)" stroke-width="2" />
  <line x1="100" y1="256" x2="68" y2="220" stroke="url(#smt-depth-grad)" stroke-width="1.5" />
  <line x1="100" y1="256" x2="68" y2="292" stroke="url(#smt-depth-grad)" stroke-width="1.5" />
  
  <line x1="184" y1="180" x2="136" y2="136" stroke="url(#smt-depth-grad)" stroke-width="1.8" />
  <line x1="136" y1="136" x2="108" y2="112" stroke="url(#smt-depth-grad)" stroke-width="1.2" stroke-dasharray="2 3" />
  <line x1="136" y1="136" x2="148" y2="96" stroke="url(#smt-depth-grad)" stroke-width="1.2" stroke-dasharray="2 3" />

  <line x1="184" y1="332" x2="136" y2="376" stroke="url(#smt-depth-grad)" stroke-width="1.8" />
  <line x1="136" y1="376" x2="108" y2="400" stroke="url(#smt-depth-grad)" stroke-width="1.2" stroke-dasharray="2 3" />
  <line x1="136" y1="376" x2="148" y2="416" stroke="url(#smt-depth-grad)" stroke-width="1.2" stroke-dasharray="2 3" />

  <!-- External SMT Nodes (Leaves) -->
  <circle cx="68" cy="220" r="4.5" fill="#34D399" />
  <circle cx="68" cy="292" r="4.5" fill="#34D399" />
  <circle cx="100" cy="256" r="6" fill="#10B981" />
  <circle cx="108" cy="112" r="4" fill="#6EE7B7" />
  <circle cx="148" cy="96" r="4" fill="#6EE7B7" />
  <circle cx="136" cy="136" r="5" fill="#10B981" />
  <circle cx="108" cy="400" r="4" fill="#6EE7B7" />
  <circle cx="148" cy="416" r="4" fill="#6EE7B7" />
  <circle cx="136" cy="376" r="5" fill="#10B981" />

  <!-- Primary CHORD Harmonic C Monogram Arc -->
  <path d="M 360 148 C 300 90, 160 100, 160 256 C 160 412, 300 422, 360 364" 
        fill="none" 
        stroke="url(#monogram-c-grad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        filter="url(#glow-3)" />

  <!-- High-Precision Core Spine Line -->
  <path d="M 360 148 C 300 90, 160 100, 160 256 C 160 412, 300 422, 360 364" 
        fill="none" 
        stroke="#ECFDF5" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-dasharray="14 10" />

  <!-- Monogram Terminal Anchors (Harmonic Octave Nodes) -->
  <circle cx="360" cy="148" r="14" fill="#042F2E" stroke="#34D399" stroke-width="3" filter="url(#glow-3)" />
  <circle cx="360" cy="148" r="6" fill="#ECFDF5" />

  <circle cx="360" cy="364" r="14" fill="#042F2E" stroke="#34D399" stroke-width="3" filter="url(#glow-3)" />
  <circle cx="360" cy="364" r="6" fill="#ECFDF5" />

  <!-- Central Root Node on Spine -->
  <circle cx="160" cy="256" r="12" fill="#042F2E" stroke="#10B981" stroke-width="3" filter="url(#glow-3)" />
  <circle cx="160" cy="256" r="5" fill="#ECFDF5" />
</svg>