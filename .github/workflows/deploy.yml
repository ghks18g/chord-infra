name: Chord-Infra CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-vps-deployment
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Turbo Build (5 Apps & Shared Packages)
        run: npx turbo run build

  deploy-vps:
    name: Deploy to Production VPS
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Execute Remote SSH Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "🚀 [CI/CD] Starting Chord-Infra deployment on VPS..."
            
            # 1. Update chord-infra source
            git config --global --add safe.directory /opt/chord/chord-infra || true
            if [ -d "/opt/chord/chord-infra/.git" ]; then
              cd /opt/chord/chord-infra
              git remote set-url origin https://github.com/${{ github.repository }}.git 2>/dev/null || git remote add origin https://github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard origin/main
            else
              rm -rf /opt/chord/chord-infra
              echo "Cloning chord-infra via HTTPS..."
              git clone https://github.com/${{ github.repository }}.git /opt/chord/chord-infra
              cd /opt/chord/chord-infra
            fi

            # 2. Rebuild and restart microservices orchestrator
            cd /opt/chord/chord-go/deploy/prod
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans redis scan-api indexer-api gas-relayer contract-verifier web

            # 3. Clean up legacy containers & dangling images
            docker image prune -f

            # 4. Integrate with Caddy Reverse Proxy & Reload
            if [ -f "/opt/freddie-forge/Caddyfile" ]; then
              echo "🔄 [CI/CD] Reloading Caddy with updated Scan API gateway and flushing upstream cache..."
              sed -i 's/chordscan-indexer-api:3002/chordscan-scan-api:3002/g' /opt/freddie-forge/Caddyfile
              docker restart freddie-forge-prod-caddy-1 || docker exec freddie-forge-prod-caddy-1 caddy reload --config /etc/caddy/Caddyfile --force || true
            fi

            # 5. Service healthchecks
            echo "🔍 [CI/CD] Verifying service health..."
            sleep 5
            docker ps --filter "name=chord" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            # Verify Scan API endpoint
            curl -fsS http://127.0.0.1:3002/api/stats > /dev/null && echo "✅ Scan API Healthy"

            # 6. Auto-seed and verify genesis contracts if chain height is 0
            CURRENT_HEIGHT=$(curl -s -X POST http://127.0.0.1:8545 -H 'Content-Type: application/json' -d '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' | grep -o '"result":"0x[0-9a-fA-F]*"' | cut -d'"' -f4)
            if [ "$CURRENT_HEIGHT" = "0x0" ] || [ -z "$CURRENT_HEIGHT" ]; then
              echo "🌱 [CI/CD] Chain at genesis (Height 0). Seeding genesis contracts (Faucet, Forwarder, MultiSig)..."
              cd /opt/chord/chord-go && node scripts/setup-genesis-contracts.js || true
              cd /opt/chord/chord-infra && node scripts/verify-contracts.js || true
            fi
            
            echo "✅ [CI/CD] Deployment successfully completed!"
